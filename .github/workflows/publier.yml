name: Publier la boutique

# Le site est un export statique publié sur GitHub Pages. Tout vit chez
# GitHub : le code, le contenu, les photos, la construction et la publication.
#
# Une modification faite par Didine depuis /admin/ est un commit sur `main` —
# ce workflow le voit passer et republie le site. Elle n'a rien d'autre à
# faire, et rien à installer.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construire:
    runs-on: ubuntu-latest
    env:
      # Identifiant public PayPal. Ce n'est pas un secret — il figure dans
      # l'adresse du script chargé par la page de commande — mais il change
      # d'un compte à l'autre, donc il est rangé dans les variables du dépôt.
      # Absent, le site se construit quand même : la page de commande propose
      # alors de contacter Didine au lieu d'afficher un bouton mort.
      NEXT_PUBLIC_PAYPAL_CLIENT_ID: ${{ vars.PAYPAL_CLIENT_ID }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      - name: Vérifier les types
        run: npx tsc --noEmit

      - name: Construire le site
        # `npm run build` réduit d'abord les photos déposées par Didine, puis
        # exporte le site.
        run: npm run build

      - name: Vérifier la page publiée
        run: |
          set -e
          test -f out/index.html || { echo "::error::out/index.html absent"; exit 1; }

          # Sans .nojekyll, GitHub Pages ignore /_next/ et publie un site sans
          # styles ni JavaScript — sans rien signaler nulle part.
          test -f out/.nojekyll || { echo "::error::.nojekyll absent : le site serait publié sans styles"; exit 1; }

          # Le CMS de Didine doit être en ligne, sinon elle ne peut plus rien
          # modifier.
          test -f out/admin/index.html || { echo "::error::Le CMS n'est pas publié"; exit 1; }
          test -f out/admin/config.yml || { echo "::error::La configuration du CMS est absente"; exit 1; }

          for balise in '<!DOCTYPE html>' 'lang="fr"' 'name="viewport"'; do
            grep -qF "$balise" out/index.html || { echo "::error::Balise manquante : $balise"; exit 1; }
          done

          # Les savons sont fondus et coulés, pas saponifiés à froid. Ces mots
          # ont déjà été publiés par erreur : le déploiement échoue s'ils
          # reviennent, sur n'importe quelle page.
          if grep -rqiE 'saponifi|semaines de cure|surgras' out/; then
            echo "::error::Mention de fabrication inexacte détectée :"
            grep -rliE 'saponifi|semaines de cure|surgras' out/ || true
            exit 1
          fi

          # Sans le préfixe, toutes les feuilles de style et toutes les photos
          # tombent en 404 une fois publiées.
          grep -qF '/lessavonsdedidine/_next/' out/index.html \
            || { echo "::error::Le préfixe de chemin n'est pas appliqué"; exit 1; }

          # Une photo sans description est inutilisable au lecteur d'écran.
          # Un alt="" volontaire s'écrit alt="" : ce sont les balises SANS
          # attribut alt du tout qui sont fautives.
          if grep -roE '<img [^>]*>' out/ | grep -v 'alt=' | head -5 | grep -q .; then
            echo "::error::Une balise <img> sans attribut alt a été publiée :"
            grep -roE '<img [^>]*>' out/ | grep -v 'alt=' | head -5
            exit 1
          fi

          # Le catalogue ne doit jamais se retrouver vide après une
          # modification au CMS : un fichier mal enregistré publierait une
          # boutique sans aucun produit, et personne ne s'en apercevrait.
          produits=$(find out/savons -mindepth 1 -maxdepth 1 -type d | wc -l)
          if [ "$produits" -lt 1 ]; then
            echo "::error::Aucune fiche produit n'a été produite. Le catalogue est vide ou illisible."
            exit 1
          fi

          if [ -z "$NEXT_PUBLIC_PAYPAL_CLIENT_ID" ]; then
            echo "::warning::PAYPAL_CLIENT_ID n'est pas défini dans les variables du dépôt — \
          la page de commande renverra vers Didine au lieu d'accepter un paiement."
          fi

          echo "Site construit : $(find out -name '*.html' | wc -l) pages, $produits produits, $(du -sh out | cut -f1)."

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deployer:
    needs: construire
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4
