name: Publier la boutique

# Le site est un export statique de l'application Next.js : GitHub Pages ne
# sert que des fichiers, il n'y a donc ni base de données ni code serveur.
# Le paiement se fait entièrement dans le navigateur, via PayPal.
# Voir MISE-EN-LIGNE.md.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construire:
    runs-on: ubuntu-latest
    env:
      # Identifiant public PayPal. Ce n'est pas un secret — il est visible dans
      # le code de la page — mais il change d'un compte à l'autre, donc il est
      # rangé dans les variables du dépôt plutôt qu'écrit ici.
      # Absent, le site se construit quand même : la page de commande propose
      # alors de contacter Didine au lieu d'afficher un bouton mort.
      NEXT_PUBLIC_PAYPAL_CLIENT_ID: ${{ vars.PAYPAL_CLIENT_ID }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      - name: Vérifier les types
        run: npx tsc --noEmit

      - name: Construire le site
        run: npm run build

      - name: Vérifier la page publiée
        run: |
          set -e
          test -f out/index.html || { echo "::error::out/index.html absent"; exit 1; }

          for balise in '<!DOCTYPE html>' 'lang="fr"' 'name="viewport"'; do
            grep -qF "$balise" out/index.html || { echo "::error::Balise manquante : $balise"; exit 1; }
          done

          # Les savons sont fondus et coulés, pas saponifiés à froid. Ces mots
          # ont déjà été publiés par erreur : le déploiement échoue s'ils
          # reviennent, sur n'importe quelle page.
          if grep -rqiE 'saponifi|semaines de cure|surgras' out/; then
            echo "::error::Mention de fabrication inexacte détectée :"
            grep -rliE 'saponifi|semaines de cure|surgras' out/ || true
            exit 1
          fi

          # Le préfixe /lessavonsdedidine est obligatoire : sans lui, toutes
          # les feuilles de style et toutes les photos tombent en 404.
          grep -qF '/lessavonsdedidine/_next/' out/index.html \
            || { echo "::error::Le préfixe de chemin n'est pas appliqué"; exit 1; }

          # Les photos de Didine doivent être publiées, en deux tailles.
          for p in savons-parfums savons-fleurs savons-coffret savons-coffret-2 \
                   savons-parfums-ovales theme-safari theme-salon theme-chevaux; do
            test -f "out/photos/$p.webp"        || { echo "::error::Photo absente : $p.webp"; exit 1; }
            test -f "out/photos/$p@small.webp"  || { echo "::error::Photo absente : $p@small.webp"; exit 1; }
          done

          # Une photo sans description est inutilisable au lecteur d'écran.
          # Les alt="" volontaires (photo purement décorative, déjà décrite à
          # côté) s'écrivent alt="" : ce sont les balises SANS attribut alt
          # du tout qui sont fautives.
          if grep -roE '<img [^>]*>' out/ | grep -v 'alt=' | head -5 | grep -q .; then
            echo "::error::Une balise <img> sans attribut alt a été publiée :"
            grep -roE '<img [^>]*>' out/ | grep -v 'alt=' | head -5
            exit 1
          fi

          if [ -z "$NEXT_PUBLIC_PAYPAL_CLIENT_ID" ]; then
            echo "::warning::PAYPAL_CLIENT_ID n'est pas défini dans les variables du dépôt — \
          la page de commande renverra vers Didine au lieu d'accepter un paiement."
          fi

          echo "Site construit : $(find out -name '*.html' | wc -l) pages, $(du -sh out | cut -f1)."

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deployer:
    needs: construire
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4
