name: Réveil hebdomadaire

# Un projet Supabase gratuit se met en pause après 7 jours sans la moindre
# requête, et il faut alors le réveiller à la main depuis leur tableau de
# bord — la boutique est inaccessible en attendant.
#
# Cette tâche demande une page qui interroge la base. Une visite suffit à
# remettre le compteur à zéro, donc une par semaine suffit largement. Une
# boutique qui reçoit des visiteurs n'en a pas besoin ; c'est pour les
# semaines creuses, et c'est précisément là que ça compte.
on:
  schedule:
    # Lundi 8 h UTC. Le jour importe peu, la régularité si.
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reveiller:
    runs-on: ubuntu-latest
    steps:
      - name: Demander une page qui lit la base
        env:
          # À renseigner dans Settings → Secrets and variables → Actions →
          # Variables, sous le nom ADRESSE_BOUTIQUE.
          # Exemple : https://les-savons-de-didine.netlify.app
          ADRESSE: ${{ vars.ADRESSE_BOUTIQUE }}
        run: |
          set -e
          if [ -z "$ADRESSE" ]; then
            echo "::warning::ADRESSE_BOUTIQUE n'est pas définie — rien à réveiller."
            exit 0
          fi

          # /savons interroge la table des produits : c'est ce qui compte,
          # une page purement statique ne réveillerait pas la base.
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 60 "$ADRESSE/savons")

          if [ "$code" = "200" ]; then
            echo "Boutique joignable, base réveillée."
          else
            echo "::error::La boutique a répondu $code. Base en pause, ou déploiement cassé."
            exit 1
          fi
