# Gestion du catalogue — ce que Didine voit sur /admin/.
#
# Chaque modification faite ici devient un commit dans le dépôt GitHub, et la
# publication se refait toute seule. Il n'y a ni serveur ni base de données :
# le contenu EST le dépôt.
#
# Les photos déposées ici partent dans contenu/photos/ telles qu'elles sortent
# du téléphone. Elles sont redressées, réduites en 1200 et 600 px et converties
# en WebP à la construction, par scripts/preparer-photos.mjs. Didine n'a rien
# à préparer.

backend:
  name: github
  repo: morpheus45/lessavonsdedidine
  branch: main
  # Un seul bouton de connexion, celui qui fonctionne.
  #
  # Par défaut le CMS propose d'abord « Sign In with GitHub », en bleu et bien
  # en évidence — mais ce chemin passe par OAuth, qui exige un service
  # intermédiaire qu'on n'a pas : il répond « Authentication aborted ». Le
  # bouton qui marche était le petit gris en dessous.
  #
  # Un écran de connexion dont le bouton principal échoue toujours n'est pas
  # une interface, c'est un piège. On ne garde que le jeton.
  auth_methods: [token]

# Les photos vivent hors de public/ : ce sont les ORIGINAUX, qui ne doivent
# pas être publiés tels quels. `public_folder` est l'adresse qu'aura la
# version réduite une fois le site construit.
media_folder: contenu/photos
public_folder: /photos

# Le site est reconstruit à chaque commit : on prévient plutôt que de laisser
# Didine recharger la page en se demandant pourquoi rien ne bouge.
site_url: https://morpheus45.github.io/lessavonsdedidine/
display_url: https://morpheus45.github.io/lessavonsdedidine/
logo_url: https://morpheus45.github.io/lessavonsdedidine/icone-192.png

# Interface en français. Elle l'est depuis une version récente du CMS — la
# version périmée qui était épinglée ici ne parlait qu'anglais, ce qui m'avait
# fait conclure à tort que le français n'existait pas.
locale: fr

collections:
  # ── Ce qui bloque l'ouverture de la boutique ───────────────────────
  # Une fiche unique, en tête de liste, où Didine répond aux questions
  # qu'elle seule peut trancher. Chaque champ vide ici est une chose que
  # personne d'autre ne peut inventer sans mentir.
  # ── Ce qu'il manque pour finir le site ─────────────────────────────
  # PRODUIT PAR scripts/generer-questionnaire.mjs — ne pas modifier à la main.
  #
  # Uniquement des questions dont la réponse change quelque chose sur une
  # page. Rien d'administratif : l'immatriculation et les mentions légales
  # attendront que l'activité soit déclarée.
  - name: reponses
    label: À compléter
    files:
      - name: reponses
        label: Questions en attente
        file: contenu/reponses.md
        description: >-
          Chaque section se déplie. Répondez à votre rythme, rien n'est à
          valider en bloc. Laissez vide ce dont vous n'êtes pas sûre : un
          blanc vaut mieux qu'une information fausse sur un site de vente.
        fields:
          - label: "La livraison"
            name: livraison
            widget: object
            collapsed: true
            hint: >-
              Ces chiffres s'affichent déjà sur le site, et c'est moi qui les ai
              écrits sans vous les demander.
            fields:
              - label: "Combien facturez-vous la livraison ?"
                name: frais
                widget: string
                required: false
                hint: >-
                  EN ATTENTE POUR OUVRIR LA BOUTIQUE. Le site annonce 4,90 €. C'est
                  un chiffre que j'ai inventé. Exemple de réponse : « 5,50 », ou « 0
                  » si vous l'offrez toujours.
              - label: "À partir de quel montant est-elle offerte ?"
                name: seuilOffert
                widget: string
                required: false
                hint: >-
                  EN ATTENTE POUR OUVRIR LA BOUTIQUE. Inventé aussi : le site
                  annonce « offerte dès 39 € ». Exemple : « 50 », ou « jamais ».
              - label: "Sous combien de temps expédiez-vous un savon ?"
                name: delaiExpedition
                widget: string
                required: false
                hint: >-
                  EN ATTENTE POUR OUVRIR LA BOUTIQUE. Le site affirme « expédié sous
                  48 h » sur toutes ses pages. Je l'ai inventé. Exemple : « 3 à 4
                  jours ».
              - label: "Comment livrez-vous ?"
                name: mode
                widget: text
                required: false
                hint: >-
                  La Poste, point relais, en main propre ? Et partout en France, ou
                  seulement autour de chez vous ?

          - label: "Les produits"
            name: produits
            widget: object
            collapsed: true
            hint: "Ce que le site dit de vos savons et de vos vitrines."
            fields:
              - label: "La liste INCI de votre base de savon"
                name: inci
                widget: text
                required: false
                hint: >-
                  EN ATTENTE POUR OUVRIR LA BOUTIQUE. Recopiez mot à mot l'étiquette
                  de votre fournisseur, dans le même ordre. La fiche contient
                  aujourd'hui un texte d'attente.
              - label: "Combien pèse un savon ?"
                name: poids
                widget: string
                required: false
                hint: >-
                  En grammes. Le site n'affiche aucun poids aujourd'hui, alors qu'un
                  cosmétique doit le porter.
              - label: "Combien de temps se garde un savon ?"
                name: conservation
                widget: string
                required: false
                hint: >-
                  J'ai écrit « de préférence dans les 12 mois après ouverture » sans
                  le savoir. Vrai ?
              - label: "Combien de temps pour monter une vitrine ?"
                name: delaiVitrine
                widget: string
                required: false
                hint: >-
                  EN ATTENTE POUR OUVRIR LA BOUTIQUE. J'avais écrit « environ une
                  semaine ». Je l'ai retiré du site en attendant : aucun délai n'est
                  annoncé pour l'instant.
              - label: "Ce qui distingue la petite, la moyenne et la grande vitrine"
                name: tailles
                widget: text
                required: false
                hint: >-
                  J'ai inventé « quelques objets », « scène complète », « scène
                  détaillée », et je n'ai aucune dimension.
              - label: "Acceptez-vous un thème qui ne figure pas dans la liste ?"
                name: surMesure
                widget: text
                required: false
                hint: >-
                  Le site l'affirme aujourd'hui, sans que personne l'ait confirmé. Y
                  a-t-il des thèmes que vous ne savez pas ou ne voulez pas faire ?
              - label: "Travaillez-vous vraiment à la commande, en petites quantités ?"
                name: petitesSeries
                widget: text
                required: false
                hint: >-
                  Le site le répète partout : « faits main en petites séries », « à
                  la demande ». Je l'ai déduit, pas vérifié.

          - label: "L'allure du site"
            name: visuel
            widget: object
            collapsed: true
            hint: >-
              Tout ce que vous voyez — couleurs, logo, typographie — vient de
              moi. Rien n'a été validé par vous, et tout peut changer.
            fields:
              - label: "Les couleurs vous plaisent-elles ?"
                name: couleurs
                widget: text
                required: false
                hint: >-
                  Vert forêt, crème, rouge grenat, un peu de doré. Dites franchement
                  si ça ne vous ressemble pas — c'est votre boutique.
              - label: "Le logo — le rond vert avec le D"
                name: logo
                widget: text
                required: false
                hint: >-
                  Je l'ai dessiné faute de mieux. Avez-vous déjà un logo, une
                  enseigne, quelque chose que vous utilisez sur vos étiquettes ?
              - label: "Vos étiquettes et vos emballages actuels"
                name: etiquettes
                widget: text
                required: false
                hint: >-
                  J'ai vu « FAIT MAIN · AVEC AMOUR » sur vos autocollants et je l'ai
                  repris. Décrivez ce que vous utilisez — ou déposez-en une photo
                  dans Produits.
              - label: "Le nom de la boutique est-il le bon ?"
                name: nom
                widget: text
                required: false
                hint: >-
                  Le site s'appelle « Les Savons de Didine ». Mais vous faites aussi
                  des vitrines, qui ne sont pas des savons. Est-ce le nom que vous
                  voulez ?
              - label: "Ce qui vous gêne quand vous regardez le site"
                name: aVoir
                widget: text
                required: false
                hint: >-
                  Une page, une photo, une phrase. Même « je ne sais pas dire
                  pourquoi mais ça ne me plaît pas » est une réponse utile.

          - label: "Vous"
            name: vous
            widget: object
            collapsed: true
            hint: "Pour la page qui parle de vous, aujourd'hui vide de votre parole."
            fields:
              - label: "Depuis quand faites-vous du savon ?"
                name: depuisQuand
                widget: string
                required: false
                hint: "Une année suffit."
              - label: "Qu'est-ce qui vous a donné envie de commencer ?"
                name: pourquoi
                widget: text
                required: false
                hint: >-
                  Deux ou trois phrases, avec vos mots. C'est ce qui distingue une
                  boutique artisanale d'un site de revente.
              - label: "Ce que vous préférez fabriquer"
                name: preference
                widget: text
                required: false
                hint: "Les savons, les vitrines ? Et pourquoi ?"
              - label: "Ce qu'on vous demande le plus souvent"
                name: demande
                widget: text
                required: false
                hint: "Un parfum, un thème ? Ça aide à mettre en avant ce qui se vend."
              - label: "Votre adresse électronique, celle que les clientes verront"
                name: email
                widget: string
                required: false
                hint: >-
                  EN ATTENTE POUR OUVRIR LA BOUTIQUE. Elle sera PUBLIQUE, donc
                  visible des robots à spam : prenez-en une dédiée à la boutique.
                  Sans elle, personne ne peut vous joindre.
              - label: "Votre compte Instagram"
                name: instagram
                widget: string
                required: false
                hint: >-
                  Pour un lien depuis le site. Exemple : didine991. Laissez vide si
                  vous préférez.

          - label: "Le reste"
            name: divers
            widget: object
            collapsed: true
            fields:
              - label: "Les parfums rangés par famille — mon rangement tient-il ?"
                name: parfums
                widget: text
                required: false
                hint: >-
                  Allez voir la page « Les parfums ». J'ai rangé vos onze parfums en
                  six familles et décrit chaque odeur, sans les avoir jamais sentis.
              - label: "Autre chose à me dire"
                name: autre
                widget: text
                required: false
                hint: >-
                  Une erreur que vous avez vue, une idée, une question. Tout ce qui
                  ne rentre dans aucune case.

  - name: produits
    label: Produits
    label_singular: Produit
    folder: contenu/produits
    create: true
    slug: '{{slug}}'
    identifier_field: nom
    summary: '{{nom}} — {{accroche}}'
    sortable_fields: [rang, nom]
    fields:
      - label: Nom
        name: nom
        widget: string
        hint: Le nom affiché en boutique. Il sert aussi à fabriquer l’adresse de la page.

      - label: Type
        name: type
        widget: select
        default: savon
        options:
          - { label: Savon ou coffret de savons, value: savon }
          - { label: Vitrine personnalisée, value: vitrine }
        hint: Une vitrine demande un prénom et un thème à la cliente avant d’être commandable.

      - label: En vente
        name: actif
        widget: boolean
        default: false
        hint: Décoché, le produit n’apparaît nulle part sur la boutique. Laissez-le décoché tant qu’il n’est pas prêt.

      - label: Ordre d’affichage
        name: rang
        widget: number
        value_type: int
        default: 10
        min: 1
        hint: Le plus petit nombre passe en premier.

      - label: Accroche
        name: accroche
        widget: string
        hint: 'La phrase sous le nom. Exemple : « 11 parfums au choix, coulés à la main ».'

      - label: Descriptif
        name: description
        widget: text
        hint: Ce qu’on lit sur la fiche. Dites ce que c’est et comment c’est fait, sans rien promettre que le savon ne fait pas.

      - label: Composition (INCI)
        name: inci
        widget: text
        required: false
        hint: >-
          Obligatoire pour un savon : la réglementation cosmétique impose
          d’afficher la composition. Recopiez la liste de l’étiquette du
          fournisseur, dans le même ordre. À laisser vide pour une vitrine,
          qui est un objet de décoration.

      - label: Formats et prix
        name: formules
        widget: list
        label_singular: Format
        summary: '{{fields.nom}} — {{fields.prixCentimes}} centimes'
        hint: Le prix le plus bas s’affiche en boutique comme « à partir de ».
        fields:
          - label: Nom du format
            name: nom
            widget: string
            hint: 'Exemple : « Lot de 5 — 4 achetés, 1 offert », « Grande ».'
          - label: Prix en centimes
            name: prixCentimes
            widget: number
            value_type: int
            min: 1
            hint: 'En CENTIMES, sans virgule : 20 € s’écrit 2000. C’est volontaire — un prix à virgule finit toujours par se tromper d’un centime.'
          - label: Nombre d’unités
            name: unites
            widget: number
            value_type: int
            default: 1
            min: 1
            hint: 5 pour un lot de 5 savons, 1 pour une vitrine.
          - label: Poids net en grammes
            name: poidsGrammes
            widget: number
            value_type: int
            default: 0
            required: false
            hint: Pour l’étiquetage réglementaire d’un savon. 0 pour une vitrine.

      - label: Photos
        name: photos
        widget: list
        label_singular: Photo
        summary: '{{fields.alt}}'
        hint: La première photo est celle qui s’affiche partout ailleurs sur le site.
        fields:
          - label: Fichier
            name: fichier
            widget: image
            hint: Envoyez la photo telle quelle, depuis votre téléphone. Elle est redressée et réduite automatiquement.
          - label: Description de la photo
            name: alt
            widget: string
            hint: >-
              Dites ce qu’on voit, en une phrase. C’est lu à voix haute aux
              personnes aveugles, et c’est ce que Google lit pour référencer
              la photo. Obligatoire.

  - name: themes
    label: Thèmes de vitrines
    label_singular: Thème
    folder: contenu/themes
    create: true
    slug: '{{slug}}'
    identifier_field: nom
    summary: '{{nom}}'
    sortable_fields: [ordre, nom]
    fields:
      - label: Nom
        name: nom
        widget: string
        hint: 'Exemple : Safari, Chevaux, Salon.'
      - label: Proposé aux clientes
        name: actif
        widget: boolean
        default: true
      - label: Ordre d’affichage
        name: ordre
        widget: number
        value_type: int
        default: 10
        min: 0
      - label: Ce qu’on voit dans la scène
        name: description
        widget: text
        hint: Une phrase sous le nom. C’est ce qui aide la cliente à choisir.
      - label: Photos
        name: photos
        widget: list
        label_singular: Photo
        summary: '{{fields.alt}}'
        hint: >-
          Une cliente choisit son thème sur la photo. Un thème sans photo se
          vend à l’aveugle.
        fields:
          - label: Fichier
            name: fichier
            widget: image
          - label: Description de la photo
            name: alt
            widget: string
            hint: Dites ce qu’on voit. Obligatoire.
