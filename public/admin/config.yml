# Gestion du catalogue — ce que Didine voit sur /admin/.
#
# Chaque modification faite ici devient un commit dans le dépôt GitHub, et la
# publication se refait toute seule. Il n'y a ni serveur ni base de données :
# le contenu EST le dépôt.
#
# Les photos déposées ici partent dans contenu/photos/ telles qu'elles sortent
# du téléphone. Elles sont redressées, réduites en 1200 et 600 px et converties
# en WebP à la construction, par scripts/preparer-photos.mjs. Didine n'a rien
# à préparer.

backend:
  name: github
  repo: morpheus45/lessavonsdedidine
  branch: main
  # Un seul bouton de connexion, celui qui fonctionne.
  #
  # Par défaut le CMS propose d'abord « Sign In with GitHub », en bleu et bien
  # en évidence — mais ce chemin passe par OAuth, qui exige un service
  # intermédiaire qu'on n'a pas : il répond « Authentication aborted ». Le
  # bouton qui marche était le petit gris en dessous.
  #
  # Un écran de connexion dont le bouton principal échoue toujours n'est pas
  # une interface, c'est un piège. On ne garde que le jeton.
  auth_methods: [token]

# Les photos vivent hors de public/ : ce sont les ORIGINAUX, qui ne doivent
# pas être publiés tels quels. `public_folder` est l'adresse qu'aura la
# version réduite une fois le site construit.
media_folder: contenu/photos
public_folder: /photos

# Le site est reconstruit à chaque commit : on prévient plutôt que de laisser
# Didine recharger la page en se demandant pourquoi rien ne bouge.
site_url: https://morpheus45.github.io/lessavonsdedidine/
display_url: https://morpheus45.github.io/lessavonsdedidine/
logo_url: https://morpheus45.github.io/lessavonsdedidine/icone-192.png

# Interface en français. Elle l'est depuis une version récente du CMS — la
# version périmée qui était épinglée ici ne parlait qu'anglais, ce qui m'avait
# fait conclure à tort que le français n'existait pas.
locale: fr

collections:
  # ── Ce qui bloque l'ouverture de la boutique ───────────────────────
  # Une fiche unique, en tête de liste, où Didine répond aux questions
  # qu'elle seule peut trancher. Chaque champ vide ici est une chose que
  # personne d'autre ne peut inventer sans mentir.
  # ── Ce qu'il manque pour finir le site ─────────────────────────────
  # PRODUIT PAR scripts/generer-questionnaire.mjs — ne pas modifier à la main.
  #
  # Uniquement des questions dont la réponse change quelque chose sur une
  # page. Rien d'administratif : l'immatriculation et les mentions légales
  # attendront que l'activité soit déclarée.
  - name: reponses
    label: À compléter
    files:
      - name: reponses
        label: Questions en attente
        file: contenu/reponses.md
        description: >-
          Chaque section se déplie. Répondez à votre rythme, rien n'est à
          valider en bloc. Laissez vide ce dont vous n'êtes pas sûre : un
          blanc vaut mieux qu'une information fausse sur un site de vente.
        fields:
          - label: "La livraison"
            name: livraison
            widget: object
            collapsed: true
            hint: >-
              Ces chiffres s'affichent déjà sur le site, et c'est moi qui les ai
              écrits sans vous les demander.
            fields:
              - label: "Combien facturez-vous la livraison ?"
                name: frais
                widget: string
                required: false
                hint: >-
                  EN ATTENTE POUR OUVRIR LA BOUTIQUE. Le site annonce 4,90 €. C'est
                  un chiffre que j'ai inventé. Exemple de réponse : « 5,50 », ou « 0
                  » si vous l'offrez toujours.
              - label: "À partir de quel montant est-elle offerte ?"
                name: seuilOffert
                widget: string
                required: false
                hint: >-
                  EN ATTENTE POUR OUVRIR LA BOUTIQUE. Inventé aussi : le site
                  annonce « offerte dès 39 € ». Exemple : « 50 », ou « jamais ».
              - label: "Sous combien de temps expédiez-vous un savon ?"
                name: delaiExpedition
                widget: string
                required: false
                hint: >-
                  EN ATTENTE POUR OUVRIR LA BOUTIQUE. Le site affirmait « expédié
                  sous 48 h » sur toutes ses pages. Je l'ai inventé et je l'ai
                  retiré. Exemple : « 3 à 4 jours ».
              - label: "Comment livrez-vous ?"
                name: mode
                widget: text
                required: false
                hint: >-
                  La Poste, point relais, en main propre ? Et partout en France, ou
                  seulement autour de chez vous ?

          - label: "Les produits"
            name: produits
            widget: object
            collapsed: true
            hint: "Ce que le site dit de vos savons et de vos vitrines."
            fields:
              - label: "La liste INCI de votre base de savon"
                name: inci
                widget: text
                required: false
                hint: >-
                  EN ATTENTE POUR OUVRIR LA BOUTIQUE. Recopiez mot à mot l'étiquette
                  de votre fournisseur, dans le même ordre. La fiche contient
                  aujourd'hui un texte d'attente.
              - label: "Combien pèse un savon ?"
                name: poids
                widget: string
                required: false
                hint: >-
                  En grammes. Le site n'affiche aucun poids aujourd'hui, alors qu'un
                  cosmétique doit le porter.
              - label: "Combien de temps se garde un savon ?"
                name: conservation
                widget: string
                required: false
                hint: >-
                  J'ai écrit « de préférence dans les 12 mois après ouverture » sans
                  le savoir. Vrai ?
              - label: "Combien de temps pour monter une vitrine ?"
                name: delaiVitrine
                widget: string
                required: false
                hint: >-
                  EN ATTENTE POUR OUVRIR LA BOUTIQUE. J'avais écrit « environ une
                  semaine ». Je l'ai retiré du site en attendant : aucun délai n'est
                  annoncé pour l'instant.
              - label: "Ce qui distingue la petite, la moyenne et la grande vitrine"
                name: tailles
                widget: text
                required: false
                hint: >-
                  J'ai inventé « quelques objets », « scène complète », « scène
                  détaillée », et je n'ai aucune dimension.
              - label: "Acceptez-vous un thème qui ne figure pas dans la liste ?"
                name: surMesure
                widget: text
                required: false
                hint: >-
                  Le site l'affirme aujourd'hui, sans que personne l'ait confirmé. Y
                  a-t-il des thèmes que vous ne savez pas ou ne voulez pas faire ?
              - label: "Travaillez-vous vraiment à la commande, en petites quantités ?"
                name: petitesSeries
                widget: text
                required: false
                hint: >-
                  Le site le répète partout : « faits main », « à la demande ». Je
                  l'ai déduit, pas vérifié.

          - label: "L'allure du site"
            name: visuel
            widget: object
            collapsed: true
            hint: >-
              Tout ce que vous voyez — couleurs, logo, écriture — vient de moi.
              Rien n'a été validé par vous, et tout peut changer. Répondez sans
              vous soucier du travail que ça me demande.
            fields:
              - label: "Le site vous ressemble-t-il ?"
                name: ressemblance
                widget: text
                required: false
                hint: >-
                  La question qui compte le plus. Vos savons sont colorés et gais —
                  bubble gum, fleurs, vitrines d'enfant — et le site que j'ai fait
                  est sobre, vert foncé, presque sérieux. C'est peut-être moi que ça
                  ressemble, pas vous. Dites-le franchement.
              - label: "Quand vous imaginez votre boutique, vous la voyez comment ?"
                name: ambiance
                widget: text
                required: false
                hint: >-
                  Sobre et élégante ? Colorée et joyeuse ? Naturelle, brute,
                  campagne ? Chic et précieuse ? Ou tout autre chose. Pas besoin de
                  vocabulaire de métier, vos mots suffisent.
              - label: "Les couleurs actuelles"
                name: couleurs
                widget: text
                required: false
                hint: >-
                  Vert forêt, crème, rouge grenat, un peu de doré. Trop sombre ?
                  Trop sérieux ? Une couleur que vous ne voulez pas voir, une que
                  vous aimeriez ?
              - label: "Des boutiques ou des sites dont l'allure vous plaît"
                name: exemples
                widget: text
                required: false
                hint: >-
                  Même un seul. Un nom, une adresse, ou juste « la boutique de
                  savons à côté du marché ». C'est ce qui m'aide le plus : voir ce
                  qui vous plaît vaut mieux que deviner.
              - label: "Le logo — le rond vert avec le D"
                name: logo
                widget: text
                required: false
                hint: >-
                  Je l'ai dessiné faute de mieux. Avez-vous déjà un logo, un dessin,
                  une enseigne ? Même fait à la main, même imparfait : ce sera
                  toujours plus vous que ce que j'invente.
              - label: "Le nom de la boutique est-il le bon ?"
                name: nom
                widget: text
                required: false
                hint: >-
                  Le site s'appelle « Les Savons de Didine ». Mais vous faites aussi
                  des vitrines, qui ne sont pas des savons. Est-ce le nom que vous
                  voulez garder ?
              - label: "Ce qui vous gêne quand vous regardez le site"
                name: gene
                widget: text
                required: false
                hint: >-
                  Une page, une photo, une phrase, une couleur. Même « je ne sais
                  pas dire pourquoi, mais ça ne me plaît pas » est une réponse utile
                  — je trouverai quoi.

          - label: "Les photos"
            name: photos
            widget: object
            collapsed: true
            hint: >-
              Je n'ai que les neuf photos que vous aviez envoyées. Le site en
              manque, et ce sont elles qui vendent — bien plus que mes phrases.
              Envoyez-les par message, telles qu'elles sortent du téléphone :
              elles sont redressées et allégées automatiquement.
            fields:
              - label: "Quelles photos pouvez-vous faire ?"
                name: aEnvoyer
                widget: text
                required: false
                hint: >-
                  EN ATTENTE POUR OUVRIR LA BOUTIQUE. Ce qui manque le plus : vos
                  mains en train de travailler, votre plan de travail, les moules,
                  une coulée en cours, des savons en train de sécher, une vitrine en
                  cours de montage, vos emballages. Dites ce que vous pouvez faire,
                  je vous dirai lesquelles servent le plus.
              - label: "La vitrine « chambre d'enfant »"
                name: chambreEnfant
                widget: string
                required: false
                hint: >-
                  EN ATTENTE POUR OUVRIR LA BOUTIQUE. La seule photo que j'ai porte
                  deux autocollants ajoutés dans la messagerie : je ne peux pas la
                  mettre en boutique. C'est le seul thème sans image, il se vend
                  donc à l'aveugle.
              - label: "Accepteriez-vous une photo de vous ?"
                name: vousMeme
                widget: text
                required: false
                hint: >-
                  Même de dos, même seulement vos mains. Une boutique artisanale
                  sans visage reste anonyme, et c'est ce qui la distingue d'un site
                  de revente. Mais c'est votre décision, et « non » est une réponse
                  complète.

          - label: "Votre façon de travailler"
            name: activite
            widget: object
            collapsed: true
            hint: >-
              Ce que je sais vient de quelques messages. Tout le reste, je l'ai
              deviné — et deviner, sur un site de vente, finit toujours par
              produire des phrases fausses.
            fields:
              - label: "Où fabriquez-vous ?"
                name: ou
                widget: text
                required: false
                hint: >-
                  Une pièce chez vous, un atelier, un coin de cuisine ? Sans décrire
                  ce que vous ne voulez pas montrer : c'est pour raconter juste, pas
                  pour donner votre adresse.
              - label: "Combien de savons faites-vous à la fois ?"
                name: quantite
                widget: text
                required: false
                hint: >-
                  Une coulée vous donne combien de savons ? Et vous en faites
                  combien par semaine, à peu près ?
              - label: "Où achetez-vous votre base et vos moules ?"
                name: fournisseur
                widget: text
                required: false
                hint: >-
                  Pas pour le publier — pour ne pas écrire de bêtise sur la
                  provenance. Si vous préférez ne pas le dire, laissez vide.
              - label: "Où vendez-vous aujourd’hui ?"
                name: vendre
                widget: text
                required: false
                hint: >-
                  Marchés, bouche-à-oreille, Instagram, une boutique ? Ça change ce
                  que le site doit mettre en avant.
              - label: "Qui vous achète ?"
                name: clientes
                widget: text
                required: false
                hint: >-
                  Des voisines, des collègues, des gens qui offrent ? Des habituées
                  ou des passages ? Le site s'adresse aujourd'hui à une cliente que
                  j'ai inventée.

          - label: "Ce que vous voulez vendre"
            name: ajouts
            widget: object
            collapsed: true
            hint: >-
              Le site ne propose que deux choses : des savons parfumés et des
              vitrines. S'il vous en manque, il peut les accueillir.
            fields:
              - label: "Des produits à ajouter ?"
                name: nouveaux
                widget: text
                required: false
                hint: >-
                  Des savons que vous faites déjà et qui ne sont pas en ligne,
                  d'autres formats, d'autres tailles. Décrivez-les simplement, avec
                  un prix si vous l'avez en tête.
              - label: "Des coffrets ou des assortiments ?"
                name: coffrets
                widget: text
                required: false
                hint: >-
                  J'ai vu des coffrets de quatre savons sur vos photos, mais ils ne
                  sont vendus nulle part sur le site. Voulez-vous en proposer ? À
                  quel prix, avec quoi dedans ?
              - label: "Autre chose que des savons ?"
                name: autresObjets
                widget: text
                required: false
                hint: >-
                  Bougies, décorations, cadeaux, autre chose que vous fabriquez ou
                  aimeriez fabriquer. Les vitrines montrent déjà que vous ne faites
                  pas que du savon.
              - label: "Des ventes liées à des occasions ?"
                name: occasions
                widget: text
                required: false
                hint: >-
                  Noël, fête des mères, naissances, mariages ? Si oui, le site peut
                  les préparer à l'avance plutôt que dans l'urgence.
              - label: "Ce que vous ne voulez PAS faire"
                name: refus
                widget: text
                required: false
                hint: >-
                  Un thème, un parfum, un type de commande. Aussi utile que le reste
                  : ça évite de promettre en votre nom quelque chose que vous
                  refuserez.

          - label: "Vous"
            name: vous
            widget: object
            collapsed: true
            hint: "Pour la page qui parle de vous, aujourd'hui vide de votre parole."
            fields:
              - label: "Depuis quand faites-vous du savon ?"
                name: depuisQuand
                widget: string
                required: false
                hint: "Une année suffit."
              - label: "Qu'est-ce qui vous a donné envie de commencer ?"
                name: pourquoi
                widget: text
                required: false
                hint: >-
                  Deux ou trois phrases, avec vos mots. C'est ce qui distingue une
                  boutique artisanale d'un site de revente.
              - label: "Ce que vous préférez fabriquer"
                name: preference
                widget: text
                required: false
                hint: "Les savons, les vitrines ? Et pourquoi ?"
              - label: "Ce qu'on vous demande le plus souvent"
                name: demande
                widget: text
                required: false
                hint: "Un parfum, un thème ? Ça aide à mettre en avant ce qui se vend."
              - label: "Votre adresse électronique, pour recevoir les messages"
                name: email
                widget: string
                required: false
                hint: >-
                  EN ATTENTE POUR OUVRIR LA BOUTIQUE. Elle ne sera PAS affichée sur
                  le site : les clientes écrivent par un formulaire, et le message
                  vous arrive par courriel. Votre adresse reste invisible, donc à
                  l'abri des robots à spam.
              - label: "Votre compte Instagram"
                name: instagram
                widget: string
                required: false
                hint: >-
                  Pour un lien depuis le site. Exemple : didine991. Laissez vide si
                  vous préférez.

          - label: "Le reste"
            name: divers
            widget: object
            collapsed: true
            fields:
              - label: "Les parfums rangés par famille — mon rangement tient-il ?"
                name: parfums
                widget: text
                required: false
                hint: >-
                  Allez voir la page « Les parfums ». J'ai rangé vos onze parfums en
                  six familles et décrit chaque odeur, sans les avoir jamais sentis.
              - label: "Autre chose à me dire"
                name: autre
                widget: text
                required: false
                hint: >-
                  Une erreur que vous avez vue, une idée, une question. Tout ce qui
                  ne rentre dans aucune case.

  - name: produits
    label: Produits
    label_singular: Produit
    folder: contenu/produits
    create: true
    slug: '{{slug}}'
    identifier_field: nom
    summary: '{{nom}} — {{accroche}}'
    sortable_fields: [rang, nom]
    fields:
      - label: Nom
        name: nom
        widget: string
        hint: Le nom affiché en boutique. Il sert aussi à fabriquer l’adresse de la page.

      - label: Type
        name: type
        widget: select
        default: savon
        options:
          - { label: Savon ou coffret de savons, value: savon }
          - { label: Vitrine personnalisée, value: vitrine }
        hint: Une vitrine demande un prénom et un thème à la cliente avant d’être commandable.

      - label: En vente
        name: actif
        widget: boolean
        default: false
        hint: Décoché, le produit n’apparaît nulle part sur la boutique. Laissez-le décoché tant qu’il n’est pas prêt.

      - label: Ordre d’affichage
        name: rang
        widget: number
        value_type: int
        default: 10
        min: 1
        hint: Le plus petit nombre passe en premier.

      - label: Accroche
        name: accroche
        widget: string
        hint: 'La phrase sous le nom. Exemple : « 11 parfums au choix, coulés à la main ».'

      - label: Descriptif
        name: description
        widget: text
        hint: Ce qu’on lit sur la fiche. Dites ce que c’est et comment c’est fait, sans rien promettre que le savon ne fait pas.

      - label: Composition (INCI)
        name: inci
        widget: text
        required: false
        hint: >-
          Obligatoire pour un savon : la réglementation cosmétique impose
          d’afficher la composition. Recopiez la liste de l’étiquette du
          fournisseur, dans le même ordre. À laisser vide pour une vitrine,
          qui est un objet de décoration.

      - label: Formats et prix
        name: formules
        widget: list
        label_singular: Format
        summary: '{{fields.nom}} — {{fields.prixCentimes}} centimes'
        hint: Le prix le plus bas s’affiche en boutique comme « à partir de ».
        fields:
          - label: Nom du format
            name: nom
            widget: string
            hint: 'Exemple : « Lot de 5 — 4 achetés, 1 offert », « Grande ».'
          - label: Prix en centimes
            name: prixCentimes
            widget: number
            value_type: int
            min: 1
            hint: 'En CENTIMES, sans virgule : 20 € s’écrit 2000. C’est volontaire — un prix à virgule finit toujours par se tromper d’un centime.'
          - label: Nombre d’unités
            name: unites
            widget: number
            value_type: int
            default: 1
            min: 1
            hint: 5 pour un lot de 5 savons, 1 pour une vitrine.
          - label: Poids net en grammes
            name: poidsGrammes
            widget: number
            value_type: int
            default: 0
            required: false
            hint: Pour l’étiquetage réglementaire d’un savon. 0 pour une vitrine.

      - label: Photos
        name: photos
        widget: list
        label_singular: Photo
        summary: '{{fields.alt}}'
        hint: La première photo est celle qui s’affiche partout ailleurs sur le site.
        fields:
          - label: Fichier
            name: fichier
            widget: image
            hint: Envoyez la photo telle quelle, depuis votre téléphone. Elle est redressée et réduite automatiquement.
          - label: Description de la photo
            name: alt
            widget: string
            hint: >-
              Dites ce qu’on voit, en une phrase. C’est lu à voix haute aux
              personnes aveugles, et c’est ce que Google lit pour référencer
              la photo. Obligatoire.

  - name: themes
    label: Thèmes de vitrines
    label_singular: Thème
    folder: contenu/themes
    create: true
    slug: '{{slug}}'
    identifier_field: nom
    summary: '{{nom}}'
    sortable_fields: [ordre, nom]
    fields:
      - label: Nom
        name: nom
        widget: string
        hint: 'Exemple : Safari, Chevaux, Salon.'
      - label: Proposé aux clientes
        name: actif
        widget: boolean
        default: true
      - label: Ordre d’affichage
        name: ordre
        widget: number
        value_type: int
        default: 10
        min: 0
      - label: Ce qu’on voit dans la scène
        name: description
        widget: text
        hint: Une phrase sous le nom. C’est ce qui aide la cliente à choisir.
      - label: Photos
        name: photos
        widget: list
        label_singular: Photo
        summary: '{{fields.alt}}'
        hint: >-
          Une cliente choisit son thème sur la photo. Un thème sans photo se
          vend à l’aveugle.
        fields:
          - label: Fichier
            name: fichier
            widget: image
          - label: Description de la photo
            name: alt
            widget: string
            hint: Dites ce qu’on voit. Obligatoire.
